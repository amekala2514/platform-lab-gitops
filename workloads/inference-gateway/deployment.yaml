apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: inference
  labels:
    app.kubernetes.io/name: inference-gateway
    app.kubernetes.io/part-of: platform-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-gateway
        app.kubernetes.io/part-of: platform-lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: inference-gateway:v0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: OLLAMA_URL
              value: "http://ollama.inference:11434"
            - name: LOG_LEVEL
              value: "info"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
