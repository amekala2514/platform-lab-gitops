apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: data-streaming
  labels:
    app.kubernetes.io/name: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:v0.7.2
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: KAFKA_CLUSTERS_0_NAME,              value: "platform-lab" }
            - { name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS,  value: "kafka.data-streaming.svc.cluster.local:9092" }
            - { name: DYNAMIC_CONFIG_ENABLED,             value: "true" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: data-streaming
spec:
  selector:
    app.kubernetes.io/name: kafka-ui
  ports:
    - { name: http, port: 80, targetPort: 8080 }
