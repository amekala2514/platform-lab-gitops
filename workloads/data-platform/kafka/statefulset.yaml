apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: data-streaming
  labels:
    app.kubernetes.io/name: kafka
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - { name: client,     containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - { name: KAFKA_NODE_ID,                       value: "1" }
            - { name: KAFKA_PROCESS_ROLES,                 value: "broker,controller" }
            - { name: KAFKA_LISTENERS,                     value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS,          value: "PLAINTEXT://kafka.data-streaming.svc.cluster.local:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES,     value: "CONTROLLER" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME,    value: "PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS,      value: "1@kafka-0.kafka-headless.data-streaming.svc.cluster.local:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR,         value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR,            value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE,                value: "true" }
            - { name: KAFKA_NUM_PARTITIONS,                           value: "3" }
            - { name: KAFKA_DEFAULT_REPLICATION_FACTOR,               value: "1" }
            - { name: KAFKA_LOG_DIRS,                                 value: "/var/lib/kafka/data" }
            - { name: CLUSTER_ID,                                     value: "platform-lab-kafka-1" }
            - { name: KAFKA_HEAP_OPTS,                                value: "-Xms512m -Xmx1g" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits:   { cpu: 1500m, memory: 1500Mi }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 60
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ ReadWriteOnce ]
        storageClassName: standard
        resources:
          requests:
            storage: 10Gi
