apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: data-storage
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-04-03T17-07-56Z
          envFrom:
            - secretRef:
                name: minio-credentials
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "Waiting for MinIO..."; sleep 3
              done
              mc mb -p local/lakehouse  || true
              mc mb -p local/warehouse  || true
              mc mb -p local/raw-events || true
              mc ls local/
              echo "Buckets ready."
