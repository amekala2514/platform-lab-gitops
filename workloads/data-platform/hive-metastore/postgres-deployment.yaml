apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-postgres
  namespace: data-storage
  labels:
    app.kubernetes.io/name: hive-postgres
    app.kubernetes.io/component: metastore-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hive-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive-postgres
        app.kubernetes.io/component: metastore-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: hive-postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "hive", "-d", "metastore"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "hive", "-d", "metastore"]
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hive-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: hive-postgres
  namespace: data-storage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hive-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
