apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: data-storage
  labels:
    app.kubernetes.io/name: hive-metastore
    app.kubernetes.io/component: metastore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hive-metastore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive-metastore
        app.kubernetes.io/component: metastore
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h hive-postgres -p 5432 -U hive; do
                echo "Waiting for hive-postgres..."; sleep 3
              done
              echo "Postgres ready."
        - name: fetch-jars
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cd /extra-libs
              echo "Downloading Postgres JDBC driver..."
              curl -fsSL -o postgresql.jar \
                https://jdbc.postgresql.org/download/postgresql-42.7.4.jar
              chmod 644 *.jar
              ls -lh /extra-libs/
          volumeMounts:
            - name: extra-libs
              mountPath: /extra-libs
        - name: init-schema
          image: apache/hive:4.0.0
          env:
            - name: HADOOP_CLASSPATH
              value: /extra-libs/postgresql.jar:/opt/hadoop/share/hadoop/tools/lib/*
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Checking schema status..."
              if /opt/hive/bin/schematool -dbType postgres -info \
                   -userName hive -passWord hivepass \
                   -url jdbc:postgresql://hive-postgres:5432/metastore 2>&1 | grep -q "Metastore schema version"; then
                echo "Schema already initialized, skipping."
              else
                echo "Initializing schema..."
                /opt/hive/bin/schematool -dbType postgres -initSchema \
                  -userName hive -passWord hivepass \
                  -url jdbc:postgresql://hive-postgres:5432/metastore
                echo "Schema initialized."
              fi
          volumeMounts:
            - name: extra-libs
              mountPath: /extra-libs
            - name: config
              mountPath: /opt/hive/conf/metastore-site.xml
              subPath: metastore-site.xml
            - name: config
              mountPath: /opt/hadoop/etc/hadoop/core-site.xml
              subPath: core-site.xml
      containers:
        - name: hive-metastore
          image: apache/hive:4.0.0
          env:
            - name: SERVICE_NAME
              value: metastore
            - name: DB_DRIVER
              value: postgres
            - name: IS_RESUME
              value: "true"
            - name: HADOOP_CLASSPATH
              value: /extra-libs/postgresql.jar:/opt/hadoop/share/hadoop/tools/lib/*
            - name: SERVICE_OPTS
              value: >-
                -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
                -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-postgres:5432/metastore
                -Djavax.jdo.option.ConnectionUserName=hive
                -Djavax.jdo.option.ConnectionPassword=hivepass
          ports:
            - name: thrift
              containerPort: 9083
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          readinessProbe:
            tcpSocket:
              port: thrift
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: thrift
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /opt/hive/conf/metastore-site.xml
              subPath: metastore-site.xml
            - name: config
              mountPath: /opt/hadoop/etc/hadoop/core-site.xml
              subPath: core-site.xml
            - name: extra-libs
              mountPath: /extra-libs
      volumes:
        - name: config
          configMap:
            name: hive-metastore-config
        - name: extra-libs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  namespace: data-storage
  labels:
    app.kubernetes.io/name: hive-metastore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hive-metastore
  ports:
    - name: thrift
      port: 9083
      targetPort: thrift
