apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: event-generator
  namespace: data-apps
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - host: events.platform-lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: event-generator
                port:
                  number: 80
