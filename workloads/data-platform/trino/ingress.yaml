apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trino
  namespace: data-query
spec:
  ingressClassName: nginx
  rules:
    - host: trino.platform-lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trino
                port:
                  name: http
