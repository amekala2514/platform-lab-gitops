apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history
  namespace: data-jobs
  labels:
    app.kubernetes.io/name: spark-history
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-history
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-history
    spec:
      containers:
        - name: spark-history
          image: apache/spark:3.5.3
          ports:
            - { name: http, containerPort: 18080 }
          env:
            - { name: AWS_ACCESS_KEY_ID,     value: "minioadmin" }
            - { name: AWS_SECRET_ACCESS_KEY, value: "minioadmin123" }
            - { name: AWS_REGION,            value: "us-east-1" }
            - name: SPARK_HISTORY_OPTS
              value: >-
                -Dspark.history.fs.logDirectory=s3a://spark-history/
                -Dspark.history.ui.port=18080
                -Dspark.hadoop.fs.s3a.endpoint=http://minio.data-storage.svc.cluster.local:9000
                -Dspark.hadoop.fs.s3a.path.style.access=true
                -Dspark.hadoop.fs.s3a.connection.ssl.enabled=false
                -Dspark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
                -Dspark.hadoop.fs.s3a.access.key=minioadmin
                -Dspark.hadoop.fs.s3a.secret.key=minioadmin123
                -Dspark.history.fs.update.interval=10s
          command:
            - /bin/bash
            - -c
            - |
              /opt/spark/sbin/start-history-server.sh
              tail -f /opt/spark/logs/*.out
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { cpu: 500m, memory: 768Mi }
          readinessProbe:
            httpGet: { path: /, port: 18080 }
            initialDelaySeconds: 30
            periodSeconds: 10
