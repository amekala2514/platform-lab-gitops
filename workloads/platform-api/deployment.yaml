apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: default
  labels:
    app: platform-api
    version: 0.2.0
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
        version: 0.2.0
    spec:
      containers:
        - name: platform-api
          image: ghcr.io/amekala2514/platform-api:v0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: KAFKA_ENABLED
              value: "true"
            - name: KAFKA_BROKERS
              value: kafka.data-streaming.svc.cluster.local:9092
            - name: KAFKA_TOPIC
              value: raw-events
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
