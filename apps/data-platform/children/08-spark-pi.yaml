apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-platform-spark-pi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/amekala2514/platform-lab-gitops.git
    targetRevision: main
    path: workloads/data-platform/spark-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: data-jobs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
